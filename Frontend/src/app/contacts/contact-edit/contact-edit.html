<div class="min-h-screen flex items-center justify-center bg-surface-50 p-4">

  <p-card class="w-full max-w-3xl shadow-3 border-round-2xl overflow-hidden">

    <ng-template pTemplate="header">
      <div class="p-5 bg-white border-bottom-1 surface-border">

        <div class="flex align-items-center justify-content-between">

          <div>
            <div class="text-2xl font-semibold text-color">
              Edit Contact
            </div>
            <div class="text-sm text-muted-color mt-1">
              Update contact information and save changes
            </div>
          </div>

          <div class="bg-primary-50 text-primary-600 p-3 border-round-xl">
            <i class="pi pi-user-edit text-xl"></i>
          </div>

        </div>

      </div>
    </ng-template>

    @if (loading()) {
      <div class="p-5 flex flex-column gap-3">
        <p-skeleton height="3rem" borderRadius="12px"></p-skeleton>
        <p-skeleton height="3rem" borderRadius="12px"></p-skeleton>
        <p-skeleton height="3rem" borderRadius="12px"></p-skeleton>
        <p-skeleton height="3rem" borderRadius="12px"></p-skeleton>
      </div>
    }

    @if (!loading()) {

      <form [formGroup]="form"
            (ngSubmit)="submit()"
            class="p-5 flex flex-column gap-5">

        <div class="surface-100 p-4 border-round-xl">

          <div class="text-sm font-semibold text-muted-color mb-3">
            Personal Information
          </div>

          <div class="grid formgrid">

            <div class="col-12 md:col-6 mb-3">
              <label class="block mb-2 text-sm">First Name</label>
              <input pInputText formControlName="firstName"
                     class="w-full p-inputtext-lg border-round-lg" />
            </div>

            <div class="col-12 md:col-6 mb-3">
              <label class="block mb-2 text-sm">Surname</label>
              <input pInputText formControlName="surname"
                     class="w-full p-inputtext-lg border-round-lg" />
            </div>

            <div class="col-12">
              <label class="block mb-2 text-sm">Date of Birth</label>
              <p-datepicker formControlName="dateOfBirth"
                            class="w-full"></p-datepicker>
            </div>

          </div>
        </div>

        <div class="surface-100 p-4 border-round-xl">

          <div class="text-sm font-semibold text-muted-color mb-3">
            Contact Details
          </div>

          <div class="grid formgrid">

            <div class="col-12 md:col-6 mb-3">
              <label class="block mb-2 text-sm">Phone Number</label>
              <input pInputText formControlName="phoneNumber"
                     class="w-full border-round-lg" />
            </div>

            <div class="col-12 md:col-6 mb-3">
              <label class="block mb-2 text-sm">IBAN</label>
              <input pInputText formControlName="iban"
                     class="w-full border-round-lg" />
            </div>

            <div class="col-12">
              <label class="block mb-2 text-sm">Address</label>
              <input pInputText formControlName="address"
                     class="w-full border-round-lg" />
            </div>

          </div>
        </div>

        <div class="flex gap-3 pt-2">

          <button
            pButton
            type="button"
            label="Cancel"
            icon="pi pi-times"
            class="p-button-secondary flex-1 border-round-lg"
            (click)="router.navigate(['/contacts'])">
          </button>

          <button
            pButton
            type="submit"
            label="Save Changes"
            icon="pi pi-check"
            class="p-button-success flex-1 border-round-lg"
            [disabled]="form.invalid">
          </button>

        </div>

      </form>

    }

  </p-card>

</div>
