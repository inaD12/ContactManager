<div class="min-h-screen flex align-items-center justify-content-center surface-ground p-4">
  <p-card class="w-full max-w-lg shadow-2 border-round-xl">

    <ng-template pTemplate="header">
      <div class="px-5 pt-5 pb-4 border-bottom-1 surface-border">
        <div class="flex align-items-center gap-3">
          <i class="pi pi-user-plus text-xl text-primary"></i>
          <div>
            <div class="text-lg font-semibold text-color">Create Contact</div>
            <div class="text-sm text-color-secondary">Add a new contact to your address book</div>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="p-5 flex flex-column gap-4">

      @if (success()) {
        <p-message severity="success" styleClass="w-full">
          <i class="pi pi-check-circle mr-2"></i>
          Contact created successfully!
        </p-message>
      }

      @if (error()) {
        <p-message severity="error" styleClass="w-full">
          <i class="pi pi-exclamation-circle mr-2"></i>
          {{ error() }}
        </p-message>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-3">

        <div class="grid formgrid">
          <div class="field col-12 md:col-6">
            <label class="block mb-2 text-sm font-medium">First Name</label>
            <input pInputText formControlName="firstName" class="w-full" placeholder="John" />
          </div>
          <div class="field col-12 md:col-6">
            <label class="block mb-2 text-sm font-medium">Surname</label>
            <input pInputText formControlName="surname" class="w-full" placeholder="Doe" />
          </div>
        </div>

        <div class="field">
          <label class="block mb-2 text-sm font-medium">Date of Birth</label>
          <p-datepicker formControlName="dateOfBirth" class="w-full" />
        </div>

        <div class="field">
          <label class="block mb-2 text-sm font-medium">Address</label>
          <input pInputText formControlName="address" class="w-full" placeholder="Street, City, Country" />
        </div>

        <div class="grid formgrid">
          <div class="field col-12 md:col-6">
            <label class="block mb-2 text-sm font-medium">Phone Number</label>
            <input pInputText formControlName="phoneNumber" class="w-full" placeholder="+1 234 567 8900" />
          </div>
          <div class="field col-12 md:col-6">
            <label class="block mb-2 text-sm font-medium">IBAN</label>
            <input pInputText formControlName="iban" class="w-full font-mono" placeholder="GB29 NWBK …" />
          </div>
        </div>

        <button
          pButton
          type="submit"
          icon="pi pi-user-plus"
          label="Create Contact"
          class="w-full mt-2"
          [disabled]="form.invalid">
        </button>

      </form>
    </div>

  </p-card>
</div>
