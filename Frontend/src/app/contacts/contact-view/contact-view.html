<div class="min-h-screen surface-ground flex justify-content-center">

  <div class="w-full px-4 py-6" style="max-width: 900px;">

    @if (loading()) {
      <p-card class="w-full surface-card border surface-border border-round-2xl shadow-2">
        <ng-template pTemplate="content">
          <div class="flex flex-column gap-3 p-4">
            <p-skeleton height="3rem" width="60%"></p-skeleton>
            <p-skeleton height="2rem" width="90%"></p-skeleton>
            <p-skeleton height="2rem" width="85%"></p-skeleton>
            <p-skeleton height="2rem" width="80%"></p-skeleton>
          </div>
        </ng-template>
      </p-card>
    }

    @if (!loading() && contact()) {

      <p-card class="w-full surface-card border surface-border border-round-2xl shadow-3">

        <ng-template pTemplate="title">
          <div class="flex flex-column align-items-center pb-5 pt-4 px-4 border-bottom-1 surface-border">

            <div class="bg-primary-50 text-primary-600 border-circle p-3 mb-3">
              <i class="pi pi-user text-2xl"></i>
            </div>

            <h2 class="text-3xl font-semibold text-color m-0">
              {{ contact()?.firstName }} {{ contact()?.surname }}
            </h2>

            <span class="text-sm text-color-secondary mt-1">
              Contact Information
            </span>

          </div>
        </ng-template>

        <ng-template pTemplate="content">

          <div class="p-5">

            <div class="grid formgrid p-fluid mt-2">

              <div class="field col-12 md:col-6">
                <div class="surface-50 border surface-border border-round-xl p-4">
                  <div class="text-sm text-color-secondary mb-2">
                    Date of Birth
                  </div>
                  <div class="text-base font-medium">
                    {{ contact()?.dateOfBirth | date: 'fullDate' }}
                  </div>
                </div>
              </div>

              <div class="field col-12 md:col-6">
                <div class="surface-50 border surface-border border-round-xl p-4">
                  <div class="text-sm text-color-secondary mb-2">
                    Phone Number
                  </div>
                  <div class="text-base font-medium">
                    {{ contact()?.phoneNumber }}
                  </div>
                </div>
              </div>

              <div class="field col-12">
                <div class="surface-50 border surface-border border-round-xl p-4">
                  <div class="text-sm text-color-secondary mb-2">
                    Address
                  </div>
                  <div class="text-base">
                    {{ contact()?.address }}
                  </div>
                </div>
              </div>

              <div class="field col-12">
                <div class="surface-100 border surface-border border-round-xl p-4">
                  <div class="text-sm text-color-secondary mb-2">
                    IBAN
                  </div>
                  <div class="font-mono text-sm break-all">
                    {{ contact()?.iban }}
                  </div>
                </div>
              </div>

            </div>

          </div>

        </ng-template>

      </p-card>

    }

  </div>
</div>
